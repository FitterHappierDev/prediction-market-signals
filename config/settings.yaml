# Prediction Market Signal Platform — central configuration.
# Source of truth for all thresholds, windows, and feature flags.
# Secrets (API keys, webhooks) live in environment variables, NOT here.
# Runtime overrides may be written to Redis hash `system:config` (take precedence).

# ===== INGESTION =====
ingestion:
  polymarket:
    poll_interval_seconds: 15
    backfill_days: 7
    max_requests_per_second: 4
    # Probability-bar polling is the dominant bandwidth cost. By default
    # we poll every active market; setting this list restricts the
    # expensive orderbook poll to specific categories. Trade-tape
    # polling continues across ALL active markets regardless — it's
    # cheap and gives us per-wallet activity context (Track B).
    # 2026-05-22 analysis showed sports/entertainment outcome markets
    # have no cross-asset linkage; keeping them out of probability
    # polling saves ~60% of bandwidth without losing wallet visibility.
    probability_polling_categories:
      - fed_rate
      - earnings
      - recession
      - geopolitical
      - political
      - crypto
    # Title overrides: poll probability even for non-listed categories
    # if the title matches one of these regex patterns. Catches
    # high-value event markets the keyword classifier misses (M&A,
    # regulatory approvals, corporate events).
    title_keep_patterns:
      - 'acqui[rs]'         # acquire/acquisition/acquirer
      - 'merge[rd]?'        # merge/merger/merged
      - 'antitrust'
      - 'FDA approv'
      - 'SEC settl'
      - 'FCC approv'
      - 'IPO'
      - 'spinoff'
  kalshi:
    poll_interval_seconds: 15
    api_key_env: "KALSHI_API_KEY"
    # Empirically the public API throttles below the 10 r/s the spec
    # mentioned — drop to 4 r/s to avoid 429 + 60s pauses.
    max_requests_per_second: 4
    # Discovery filters — keep Kalshi tracked market count reasonable so
    # the per-market poll cadence stays close to 1 minute. At 4 r/s the
    # cycle is roughly N markets / 4 seconds, so 1000 markets = 4 min,
    # 2000 markets = 8 min. Defaults observed 2026-05-21 cut the live
    # set from ~19,000 to a few hundred.
    min_volume_usd: 500.0
    max_days_to_close: 90
  wallet_tracer:
    max_concurrent_rpc: 5
    retrace_interval_hours: 24
    hop_depth: 2
  market_context:
    # Phase 3 Market Context Service (traditional-asset OHLCV).
    # Feature-flagged off-by-default until verified end-to-end.
    backfill_days: 30
    poll_interval_seconds: 3600   # hourly refresh

# ===== DETECTION =====
detection:
  anomaly:
    wallet_age_threshold_days: 7
    wallet_market_count_threshold: 5
    win_rate_pvalue_threshold: 0.001
    bet_size_zscore_threshold: 3.0
    pre_resolution_window_minutes: 10
    alert_threshold_watch: 4.5
    alert_threshold_critical: 7.0
  signal:
    min_prob_shift: 0.05
    volume_confirmation_ratio: 1.5
    cross_platform_required: false
    velocity_thresholds:
      sprint: 0.02
      fast: 0.005
      moderate: 0.001
  time_adjuster:
    preset_late_stage_threshold: 0.10
    preset_early_stage_threshold: 0.70
    expiring_risk_free_rate: 0.045
    triggered_confidence_discount: 0.70
    triggered_maturity_minutes: 43200

# ===== MODELS =====
models:
  stage1:
    algorithm: "lightgbm"
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    min_training_samples: 200
    calibration_method: "sigmoid"
  stage2:
    algorithm: "lightgbm"
    objective: "regression"
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
    min_training_samples: 150

# ===== RISK =====
risk:
  gates:
    min_signal_quality: 0.50
    min_linkage_score: 0.40
    min_joint_confidence: 0.55
    max_spread_bps: 20
  sizing:
    max_pm_exposure_pct: 0.05
    category_caps:
      fed_rate: 0.03
      earnings: 0.01
      geopolitical: 0.02
      recession: 0.02
      crypto: 0.01
      political: 0.01
  circuit_breakers:
    drawdown_limit_pct: 0.02
    drawdown_cooldown_days: 30
    feed_stall_minutes: 5
    psi_halt_threshold: 0.25
    brier_reduce_threshold: 0.20
    brier_recovery_days: 30

# ===== EXECUTION =====
execution:
  paper_mode: true
  brokers:
    equities: "alpaca"
    options: "alpaca"
    crypto: "ccxt"
  alpaca:
    api_key_env: "ALPACA_API_KEY"
    api_secret_env: "ALPACA_API_SECRET"
    base_url: "https://paper-api.alpaca.markets"
  order_timeout_minutes: 15

# ===== MONITORING =====
monitoring:
  health_check_interval_hours: 168  # weekly
  crowding_check_interval_days: 30
  notifications:
    slack_webhook_env: "SLACK_WEBHOOK_URL"
    telegram_bot_token_env: "TELEGRAM_BOT_TOKEN"
    telegram_chat_id_env: "TELEGRAM_CHAT_ID"

# ===== LINKAGE VALIDATION =====
linkage:
  min_layers_passing: 3
  min_composite_score: 0.60
  min_events_for_event_study: 30
  granger_resample_minutes: 5
  granger_max_lag_minutes: 360
  cross_correlation_max_lag_minutes: 2880
  min_viable_lag_minutes: 5

# ===== FEATURE FLAGS =====
# Boolean toggles. Per the design these may also be set via env var of the same
# name (uppercased) — env wins. See tech design Section 9.2.
feature_flags:
  paper_mode: true
  stage2_enabled: false
  execution_enabled: false
  crypto_enabled: false
  wallet_tracing_enabled: true
  cross_platform_required: false
  self_training_enabled: false
  market_context_enabled: false
